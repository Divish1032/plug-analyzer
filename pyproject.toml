[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "plug-analyzer"
version = "0.2.2"
description = "Local deterministic analysis of fluorescent plug formation in microscope Z-stacks"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary prototype" }
authors = [{ name = "Plug Analyzer Team" }]
dependencies = [
  "dask[array]>=2025.1,<2027",
  "dask-image>=2024.5,<2027",
  "imagecodecs>=2025.3,<2027",
  "nd2[legacy]>=0.10,<0.12",
  "numpy>=2.0,<3",
  "platformdirs>=4.3,<5",
  "psutil>=6.1,<8",
  "pydantic>=2.10,<3",
  "pyqtgraph>=0.13.7,<0.15",
  "PySide6>=6.8,<6.11",
  "scikit-image>=0.25,<0.27",
  "scipy>=1.14,<2",
  "tifffile>=2025.2,<2027",
  "zarr>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6,<8",
  "pytest>=8.3,<10",
  "pytest-qt>=4.4,<5",
  "ruff>=0.9,<1",
]
packaging = [
  "nuitka>=4.1.3,<5",
  "ordered-set>=4.1,<5",
  "zstandard>=0.23,<1",
]

[project.scripts]
plug-analyzer = "plug_analyzer.cli:main"
plug-analyzer-gui = "plug_analyzer.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/plug_analyzer"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "integration: exercises filesystem or real microscope inputs",
  "gui: requires a Qt application",
  "slow: takes longer than a normal unit test",
]

[tool.coverage.run]
branch = true
source = ["plug_analyzer"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
